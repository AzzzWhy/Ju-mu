name: Build Windows executable
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/Scribe.Tests -c Release
      - run: dotnet publish src/Scribe.Desktop -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/windows
      - uses: actions/upload-artifact@v4
        with:
          name: RenpyScribe-Windows-x64
          path: dist/windows/RenpyScribe.exe
